[deps]
Aqua = "4c88cf16-eb10-579e-8560-4a9242c79595"
FFTW = "7a1cc6ca-52ef-59f5-83cd-3a7055c09341"
ImageFiltering = "6a3955dd-da59-5b1f-98d4-e7296123deb5"
QSM = "794fc106-2fa4-440f-961c-0d7d7b47016a"
QuantitativeSusceptibilityMappingTGV = "bd393529-335a-4aed-902f-5de61cc7ff49"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
TestItemRunner = "f8b46487-2199-4994-9208-9a1283c18c0a"

[compat]
# The QSM.jl backend is exercised by test/qsm.jl, and QSM 0.5.4 throws on
# FFTW 1.9 or newer. Pinning here keeps that extension under test without
# constraining anyone who installs the package - which is the whole point of
# not capping FFTW in the package itself. FFTW has to be listed in [deps]
# above for this bound to apply at all: Pkg rejects a compat entry for a
# package the project does not depend on directly.
FFTW = "1.6 - 1.8"
